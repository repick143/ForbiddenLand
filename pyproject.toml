[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forbiddenland"
version = "0.1.0"
description = "Personal A-share stock research and analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "chen.chenn" }]
dependencies = []

[project.optional-dependencies]
data = [
    "akshare>=1.16",
    "numpy>=1.24",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
