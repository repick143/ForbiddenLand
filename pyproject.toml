[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forbiddenland"
version = "0.1.0"
description = "Personal A-share stock research and analysis toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "chen.chenn" }]
dependencies = [
    "akquant>=0.3.52,<0.4",
]

[project.optional-dependencies]
data = [
    "akshare>=1.18,<2",
    "duckdb>=1.4,<2",
    "numpy>=2.2.2",
    "pandas>=2.2.0",
    "pyarrow>=14",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
