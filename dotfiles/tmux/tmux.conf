# Add truecolor support
set-option -ga terminal-overrides ",*256col*:Tc"
# Pass modified keys such as Shift-Enter through tmux to TUI programs
set-option -g extended-keys always
set-option -g extended-keys-format csi-u
set-option -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys"
# Default terminal is 256 colors
set -g default-terminal "xterm-256color"

# Pin new panes to zsh; tmux-sensible otherwise derives this from $SHELL.
set -g default-shell /bin/zsh
set -g default-command "reattach-to-user-namespace -l /bin/zsh"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.2'

set -g @catppuccin_flavor 'mocha'
# tmux-cpu 只在加载时对 status-left/status-right 做 #{cpu_percentage} 插值，
# catppuccin 模块变量里的格式不会展开，这里在 tpm run 之前覆盖模块文本与颜色
# （catppuccin 用 -o 设置，已有值会保留），让 CPU/内存显示真实数值。
set -g @catppuccin_cpu_text " #($HOME/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_ram_text " #($HOME/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)"
set -g @catppuccin_status_cpu_text_fg "#{@thm_yellow}"
set -g @catppuccin_status_cpu_text_bg "#{@thm_surface_0}"
set -g @catppuccin_status_ram_text_fg "#{@thm_yellow}"
set -g @catppuccin_status_ram_text_bg "#{@thm_surface_0}"
# 文件夹名固定宽度（最多 16 字符，不足补空格），避免左段宽度变化导致窗口列表漂移
set -g @catppuccin_directory_text " #{p16:#{=16:#{b:pane_current_path}}}"
run '~/.tmux/plugins/tpm/tpm'

# catppuccin 状态模块：必须在 tpm run 之后设置（@catppuccin_status_* 已定义）
# 左侧：会话 + 前缀提示 + 当前目录；右侧：CPU + 内存 + 时间 + 主机名
set -g status-left "#{E:@catppuccin_status_session}#[fg=#{@thm_red},bold] #{?client_prefix,^F,  }#{E:@catppuccin_status_directory}"
set -g status-right "#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_date_time}"

# Double-click a pane line and copy it directly to the macOS clipboard.
# Keep these bindings after TPM so tmux-yank cannot replace them.
set -s copy-command 'reattach-to-user-namespace pbcopy'
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel

# --------------------------------------------------- End -----------------------------------------------------------
