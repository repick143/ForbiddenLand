# --------------------------------------------------- Tmux Config -----------------------------------------------------------

# --------------------------------------------------- prefix -----------------------------------------------------------
# 修改指令前缀
set -g prefix C-f #
unbind C-b # C-b 即 Ctrl+b 键，unbind 意味着解除绑定
bind C-f send-prefix # 绑定 Ctrl+f 为新的指令前缀

# 从tmux v1.6版起，支持设置第二个指令前缀
#set-option -g prefix2 ` # 设置一个不常用的`键作为指令前缀，按键更快些

# 添加载在配置文件指令为： r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded.."


# --------------------------------------------------- 更改新增面板键 -----------------------------------------------------------
unbind '"'
bind - splitw -v -c '#{pane_current_path}' # 垂直方向新增面板，默认进入当前目录
unbind %
bind =  splitw -h -c '#{pane_current_path}' # 水平方向新增面板，默认进入当前目录

# --------------------------------------------------- 开启鼠标支持 -----------------------------------------------------------
# v2.1及以上的版本
set-option -g mouse on



# --------------------------------------------------- vim 风格 -----------------------------------------------------------
# 绑定hjkl键为面板切换的上下左右键

bind -r k select-pane -U # 绑定k为↑
bind -r j select-pane -D # 绑定j为↓
bind -r h select-pane -L # 绑定h为←
bind -r l select-pane -R # 绑定l为→

# 面板调整大小
# 绑定Ctrl+hjkl键为面板上下左右调整边缘的快捷指令

bind -r ^k resizep -U 10 # 绑定Ctrl+k为往↑调整面板边缘10个单元格
bind -r ^j resizep -D 10 # 绑定Ctrl+j为往↓调整面板边缘10个单元格
bind -r ^h resizep -L 10 # 绑定Ctrl+h为往←调整面板边缘10个单元格
bind -r ^l resizep -R 10 # 绑定Ctrl+l为往→调整面板边缘10个单元格

# 复制模式更改为 vi 风格
# 进入复制模式 快捷键：prefix + [

setw -g mode-keys vi # 开启vi风格后，支持vi的C-d、C-u、hjkl等快捷键

# --------------------------------------------------- 复制粘贴 -----------------------------------------------------------

# 复制模式向 vi 靠拢

#旧版本：
#bind -t vi-copy v begin-selection  # 绑定v键为开始选择文本
#bind -t vi-copy y copy-selection # 绑定y键为复制选中文本

# 新版本：
bind -T copy-mode-vi v send -X begin-selection # 开始复制
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy' # 复制到系统剪贴板
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy' # 回车复制到系统剪贴板
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy' # 鼠标拖选结束自动复制到系统剪贴板
bind p pasteb # 绑定p键为粘贴文本（p键默认用于进入上一个窗口，不建议覆盖）




# --------------------------------------------------- 其他 -----------------------------------------------------------

# --------------------------------------------------- 弹窗样式 -----------------------------------------------------------
# tmux 3.8 默认 popup-style 为 bg=themedarkgrey，fzf 的 --tmux 弹窗（Ctrl-R 历史列表）
# 会因此显示成灰色。恢复终端默认底色；想跟深色状态栏一致可改为 bg=#1f2428,fg=#c9d1d9。
set -g popup-style default

#设置窗口面板起始序号
set -g base-index 1 # 设置窗口的起始下标为1
set -g pane-base-index 1 # 设置面板的起始下标为1
set -s focus-events on
set-window-option -g automatic-rename on
set-window-option -g monitor-activity on


# --------------------------------------------------- 状态栏 -----------------------------------------------------------

# 精简 Powerline 状态栏：左侧定位当前工作区，右侧保留资源与时间
set -g status on
set -g status-interval 5 # 状态栏刷新时间
setw -g monitor-activity on # 非当前窗口有内容更新时在状态栏通知
set-option -g status-justify "left"
set -g status-style "fg=#8b949e,bg=#1f2428"
set -g message-style "bg=#202529, fg=#91A8BA" # 指定消息通知的前景、后景色

# 简化窗口列表：普通窗口为纯文字，当前窗口为高亮块，活动窗口黄色提示
set -wg window-status-separator " "
set -wg window-status-format "#[fg=#a6adc8] #I:#W "
set -wg window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I:#W "
set -wg window-status-activity-style "fg=#f9e2af,bold"
# 关闭 catppuccin 对窗口列表样式的接管（需在下方 TPM 加载前生效）
set -g @catppuccin_window_status_style "none"

# status-left 固定宽度，避免窗口列表起点随左侧内容长度变化
set -g status-left-length 60
set -g status-right-length 120
# status-left/status-right 已改为 catppuccin 状态模块，见 tpm run 之后的部分


